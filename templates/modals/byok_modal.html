<!-- 14. BYOK (Bring-Your-Own-Key) Settings Modal -->
  <div id="byok-modal" class="fixed inset-0 bg-slate-900/60 dark:bg-black/80 backdrop-blur-md z-50 hidden flex items-center justify-center p-3 md:p-6 overflow-hidden" role="dialog" aria-modal="true" aria-labelledby="byok-modal-title">
    <div class="bg-white dark:bg-[#0b101b] border border-slate-200 dark:border-slate-800 rounded-3xl w-full max-w-xl overflow-hidden shadow-2xl flex flex-col max-h-[90vh]">
      <div class="p-5 border-b border-slate-200 dark:border-slate-800 flex items-center justify-between bg-slate-50 dark:bg-[#0f172a]">
        <div>
          <h3 id="byok-modal-title" class="font-bold text-slate-900 dark:text-white text-base">🔑 Kunci API LLM Pribadi (BYOK)</h3>
          <p class="text-xs text-slate-500 dark:text-slate-400 mt-0.5">Gunakan kuota API AI Anda sendiri untuk bypass limit kredit SaaS</p>
        </div>
        <button onclick="closeModal('byok-modal')" class="min-h-[44px] min-w-[44px] p-2 rounded-xl text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-800 transition flex items-center justify-center" aria-label="Tutup Modal BYOK">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>

      <div class="p-6 overflow-y-auto space-y-4">
        <div id="byok-status-banner" class="hidden p-3 rounded-xl text-xs font-semibold"></div>

        <div>
          <label for="byok-gemini-key" class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1.5">Google Gemini API Key</label>
          <input type="password" id="byok-gemini-key" placeholder="AIzaSy... (kosongkan untuk hapus)" class="w-full bg-slate-50 dark:bg-[#070b14] border border-slate-200 dark:border-slate-800 rounded-xl px-4 py-2.5 text-xs text-slate-900 dark:text-slate-200 focus:outline-none focus:border-brand-500 transition">
          <p id="byok-gemini-masked" class="text-[11px] text-slate-500 mt-1">Belum diatur</p>
        </div>

        <div>
          <label for="byok-openai-key" class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1.5">OpenAI API Key</label>
          <input type="password" id="byok-openai-key" placeholder="sk-proj-... (kosongkan untuk hapus)" class="w-full bg-slate-50 dark:bg-[#070b14] border border-slate-200 dark:border-slate-800 rounded-xl px-4 py-2.5 text-xs text-slate-900 dark:text-slate-200 focus:outline-none focus:border-brand-500 transition">
          <p id="byok-openai-masked" class="text-[11px] text-slate-500 mt-1">Belum diatur</p>
        </div>

        <div>
          <label for="byok-groq-key" class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1.5">Groq Cloud API Key</label>
          <input type="password" id="byok-groq-key" placeholder="gsk_... (kosongkan untuk hapus)" class="w-full bg-slate-50 dark:bg-[#070b14] border border-slate-200 dark:border-slate-800 rounded-xl px-4 py-2.5 text-xs text-slate-900 dark:text-slate-200 focus:outline-none focus:border-brand-500 transition">
          <p id="byok-groq-masked" class="text-[11px] text-slate-500 mt-1">Belum diatur</p>
        </div>

        <div class="p-3 bg-amber-50 dark:bg-amber-500/10 border border-amber-200 dark:border-amber-500/30 rounded-xl text-xs text-amber-700 dark:text-amber-300">
          💡 <strong>Keuntungan BYOK:</strong> Artikel yang dihasilkan dengan kunci API pribadi Anda tidak memotong kuota kredit bulanan paket SaaS.
        </div>
      </div>

      <div class="p-4 bg-slate-50 dark:bg-[#0f172a] border-t border-slate-200 dark:border-slate-800 flex items-center justify-end gap-2.5">
        <button onclick="closeModal('byok-modal')" class="min-h-[44px] px-4 py-2 bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-300 rounded-xl text-xs font-semibold transition">Batal</button>
        <button onclick="saveByokSettings()" class="min-h-[44px] px-5 py-2.5 bg-brand-600 hover:bg-brand-500 text-white rounded-xl text-xs font-bold transition shadow-md shadow-brand-500/20 active:scale-95">Simpan Kunci API</button>
      </div>
    </div>
  </div>
