<!-- SaaS Authentication Modal (Login / Register) -->
  <div id="auth-modal" class="fixed inset-0 bg-slate-900/60 dark:bg-black/80 backdrop-blur-md z-50 hidden flex items-center justify-center p-3 md:p-6 overflow-hidden">
    <div class="bg-white dark:bg-[#0b1120] border border-slate-200 dark:border-slate-800 rounded-2xl w-full max-w-md flex flex-col shadow-2xl overflow-hidden">
      <!-- Modal Header -->
      <div class="px-6 py-4 border-b border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-[#0f172a] flex items-center justify-between">
        <div class="flex items-center gap-2.5">
          <div class="w-8 h-8 rounded-xl bg-gradient-to-tr from-brand-600 to-indigo-600 flex items-center justify-center text-white font-bold text-sm">B</div>
          <div>
            <h3 class="font-bold text-slate-900 dark:text-white text-base leading-tight" id="auth-modal-title">Masuk ke Akun SaaS</h3>
            <p class="text-xs text-slate-500 dark:text-slate-400 mt-0.5">Kelola kuota, multi-blog, dan autopilot SEO</p>
          </div>
        </div>
        <button onclick="closeAuthModal()" class="w-8 h-8 rounded-lg bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-500 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white flex items-center justify-center transition" aria-label="Tutup Modal">&times;</button>
      </div>

      <!-- Auth Tabs -->
      <div class="flex border-b border-slate-200 dark:border-slate-800 bg-slate-100 dark:bg-[#090d16]">
        <button id="tab-auth-login" onclick="switchAuthTab('login')" class="flex-1 py-3 text-xs font-bold text-brand-600 dark:text-brand-400 border-b-2 border-brand-500 transition">Masuk (Login)</button>
        <button id="tab-auth-register" onclick="switchAuthTab('register')" class="flex-1 py-3 text-xs font-semibold text-slate-500 dark:text-slate-400 hover:text-slate-800 dark:text-slate-200 border-b-2 border-transparent transition">Daftar Akun Baru</button>
      </div>

      <div class="p-6 space-y-4">
        <div id="auth-error-alert" class="hidden p-3 rounded-xl bg-rose-50 dark:bg-rose-500/15 border border-rose-200 dark:border-rose-500/30 text-rose-700 dark:text-rose-300 text-xs"></div>

        <!-- Form Login -->
        <form id="form-login" onsubmit="handleLogin(event)" class="space-y-4">
          <div>
            <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1.5">Alamat Email</label>
            <input type="email" id="login-email" required placeholder="nama@email.com" class="w-full bg-slate-50 dark:bg-[#070b14] border border-slate-200 dark:border-slate-800 rounded-xl px-4 py-2.5 text-xs text-slate-900 dark:text-white placeholder-slate-400 dark:placeholder-slate-500 focus:outline-none focus:border-brand-500 transition">
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1.5">Kata Sandi</label>
            <input type="password" id="login-password" required placeholder="••••••••" class="w-full bg-slate-50 dark:bg-[#070b14] border border-slate-200 dark:border-slate-800 rounded-xl px-4 py-2.5 text-xs text-slate-900 dark:text-white placeholder-slate-400 dark:placeholder-slate-500 focus:outline-none focus:border-brand-500 transition">
          </div>
          <button type="submit" id="btn-submit-login" class="w-full py-2.5 bg-gradient-to-r from-brand-600 to-indigo-600 hover:from-brand-500 hover:to-indigo-500 text-white rounded-xl text-xs font-bold transition shadow-md shadow-brand-500/20 active:scale-95">
            <span>Masuk ke Dashboard</span>
          </button>
        </form>

        <!-- Form Register -->
        <form id="form-register" onsubmit="handleRegister(event)" class="space-y-4 hidden">
          <div>
            <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1.5">Nama Lengkap</label>
            <input type="text" id="register-name" placeholder="Budi Santoso" class="w-full bg-slate-50 dark:bg-[#070b14] border border-slate-200 dark:border-slate-800 rounded-xl px-4 py-2.5 text-xs text-slate-900 dark:text-white placeholder-slate-400 dark:placeholder-slate-500 focus:outline-none focus:border-brand-500 transition">
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1.5">Alamat Email</label>
            <input type="email" id="register-email" required placeholder="nama@email.com" class="w-full bg-slate-50 dark:bg-[#070b14] border border-slate-200 dark:border-slate-800 rounded-xl px-4 py-2.5 text-xs text-slate-900 dark:text-white placeholder-slate-400 dark:placeholder-slate-500 focus:outline-none focus:border-brand-500 transition">
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1.5">Kata Sandi (Minimal 6 Karakter)</label>
            <input type="password" id="register-password" minlength="6" required placeholder="••••••••" class="w-full bg-slate-50 dark:bg-[#070b14] border border-slate-200 dark:border-slate-800 rounded-xl px-4 py-2.5 text-xs text-slate-900 dark:text-white placeholder-slate-400 dark:placeholder-slate-500 focus:outline-none focus:border-brand-500 transition">
          </div>
          <p class="text-xs text-emerald-700 dark:text-emerald-300 bg-emerald-50 dark:bg-emerald-500/10 p-2.5 rounded-xl border border-emerald-200 dark:border-emerald-500/20">
            🎁 <b>Bonus Gratis Langsung:</b> 3 kredit artikel AI SEO otomatis diberikan saat pendaftaran selesai!
          </p>
          <button type="submit" id="btn-submit-register" class="w-full py-2.5 bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white rounded-xl text-xs font-bold transition shadow-md shadow-emerald-500/20 active:scale-95">
            <span>Buat Akun & Mulai Gratis</span>
          </button>
        </form>
      </div>
    </div>
  </div>
