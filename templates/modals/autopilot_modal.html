<!-- Autopilot Settings Modal -->
  <div id="autopilot-modal" class="fixed inset-0 bg-slate-900/60 dark:bg-black/80 backdrop-blur-md z-50 hidden flex items-center justify-center p-3 md:p-6 overflow-hidden">
    <div class="bg-white dark:bg-[#0b1120] border border-slate-200 dark:border-slate-800 rounded-2xl w-full max-w-lg flex flex-col shadow-2xl overflow-hidden">
      <div class="px-6 py-4 border-b border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-[#0f172a] flex items-center justify-between">
        <div class="flex items-center gap-2.5">
          <div class="w-8 h-8 rounded-lg bg-emerald-50 dark:bg-emerald-500/20 text-emerald-600 dark:text-emerald-400 flex items-center justify-center font-bold text-sm">⚙️</div>
          <div>
            <h3 class="font-bold text-slate-900 dark:text-white text-base leading-tight">Pengaturan Autopilot Blog</h3>
            <p class="text-xs text-slate-500 dark:text-slate-400 mt-0.5" id="autopilot-modal-subtitle">Konfigurasi otomatisasi jadwal posting untuk blog aktif</p>
          </div>
        </div>
        <button onclick="closeAutopilotModal()" class="w-8 h-8 rounded-lg bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-500 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white flex items-center justify-center transition" aria-label="Tutup Modal">&times;</button>
      </div>
      <div class="p-6 space-y-4">
        <div class="p-4 rounded-xl bg-slate-50 dark:bg-slate-900/80 border border-slate-200 dark:border-slate-800 flex items-center justify-between">
          <div>
            <span class="text-xs font-bold text-slate-900 dark:text-white block">Status Autopilot Latar Belakang</span>
            <span class="text-xs text-slate-500 dark:text-slate-400">Jalankan riset & draf artikel secara terjadwal otomatis</span>
          </div>
          <label class="relative inline-flex items-center cursor-pointer">
            <input type="checkbox" id="autopilot-enabled-toggle" checked class="sr-only peer">
            <div class="w-11 h-6 bg-slate-200 dark:bg-slate-800 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-emerald-500"></div>
          </label>
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 uppercase tracking-wider mb-1.5">Tujuan Simpan / Publikasi</label>
          <select id="autopilot-publish-mode" class="w-full bg-slate-50 dark:bg-[#070b14] border border-slate-200 dark:border-slate-800 rounded-xl px-4 py-2.5 text-xs text-slate-900 dark:text-white focus:outline-none focus:border-brand-500 transition">
            <option value="blogger_draft">Kirim sebagai Draf di Blogger (Direkomendasikan - siap tinjau)</option>
            <option value="draft">Simpan Draf di Dashboard Saja (Review manual sebelum kirim)</option>
            <option value="published">Langsung Publikasikan Live ke Blogger (Full Hands-Free)</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 uppercase tracking-wider mb-1.5">Frekuensi Jadwal Posting</label>
          <select id="autopilot-schedule-freq" class="w-full bg-slate-50 dark:bg-[#070b14] border border-slate-200 dark:border-slate-800 rounded-xl px-4 py-2.5 text-xs text-slate-900 dark:text-white focus:outline-none focus:border-brand-500 transition">
            <option value="daily">1 Artikel per Hari (Setiap Pukul 08:00 WIB)</option>
            <option value="twice_daily">2 Artikel per Hari (Pukul 08:00 & 17:00 WIB)</option>
            <option value="manual">Manual Saja (Hanya saat tombol ditekan)</option>
          </select>
        </div>
      </div>
      <div class="px-6 py-3.5 bg-slate-50 dark:bg-[#0f172a] border-t border-slate-200 dark:border-slate-800 flex items-center justify-end gap-2.5">
        <button onclick="closeAutopilotModal()" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-300 border border-slate-200 dark:border-slate-700 rounded-xl text-xs font-semibold transition">Batal</button>
        <button id="btn-save-autopilot" onclick="saveAutopilotSettings()" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl text-xs font-bold transition shadow-md shadow-emerald-600/20 active:scale-95">
          Simpan Pengaturan
        </button>
      </div>
    </div>
  </div>
