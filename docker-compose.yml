services:
  web:
    build: .
    container_name: blogger-autopilot-web
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8090:8090"
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
      - ./tokens:/app/tokens
      - ./settings:/app/settings
      - ./client_secret.json:/app/client_secret.json:ro
    environment:
      - PORT=8090
      - HOST=0.0.0.0
      # Production should set DATABASE_URL=postgresql://... in .env (Supabase / Managed PostgreSQL).
      # Local fallback stores SQLite inside the shared ./data directory rather than a single-file mount.
      - BLOGGER_SAAS_DB_PATH=/app/data/data_saas.db
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8090/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  scheduler:
    build: .
    container_name: blogger-autopilot-scheduler
    restart: unless-stopped
    env_file:
      - .env
    command: ["python", "autopilot_scheduler.py", "3600"]
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
      - ./tokens:/app/tokens
      - ./settings:/app/settings
      - ./client_secret.json:/app/client_secret.json:ro
    environment:
      - BLOGGER_SAAS_DB_PATH=/app/data/data_saas.db
    depends_on:
      web:
        condition: service_healthy
