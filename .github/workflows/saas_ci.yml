name: Blogger Auto-Pilot SaaS CI/CD Test Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-suite:
    name: Run Multi-Tenant SaaS Automated Tests & Checks
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code Repository
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Set up Node.js 20 (Client JS Syntax Check)
      uses: actions/setup-node@v4
      with:
        node-version: "20"

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential curl libpq-dev

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Alembic Database Migrations
      run: |
        alembic upgrade head

    - name: Validate Frontend JavaScript Syntax
      run: |
        for f in static/js/*.js; do node --check "$f" || exit 1; done

    - name: Run Full Pytest Unit & Integration Suite
      run: |
        pytest tests/ -v

    - name: Run Production Readiness Diagnostics
      run: |
        python scripts/check_saas_readiness.py
